[project]
name = "avito-bot"
version = "0.1.0"
description = "Личный Telegram-бот: новые объявления Авито о комплектующих и ПК"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "httpx>=0.28.1",
    "playwright>=1.64.1",
]

[project.scripts]
avito-bot = "avito_bot:main"
avito-setup = "avito_bot.setup_wizard:main"
avito-unblock = "avito_bot.unblock:main"
avito-supervise = "avito_bot.supervisor:main"
avito-service = "avito_bot.service:main"
avito-metrics = "avito_bot.metrics:main"
avito-study = "avito_bot.study:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
